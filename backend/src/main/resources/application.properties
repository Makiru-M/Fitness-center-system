# Server configuration
server.port=8080
server.servlet.context-path=

# Database configuration (PostgreSQL)
# Note: Host port is 5544 from docker-compose.yml, fallback to 5432 if needed
app.datasource.host=${DB_HOST:localhost}
app.datasource.port=${DB_PORT:5544}
app.datasource.database=${DB_NAME:fitness_center_db}
app.datasource.url=jdbc:postgresql://${app.datasource.host}:${app.datasource.port}/${app.datasource.database}

# Superuser credentials for auto-healing / bootstrapping if guest_user is missing
app.datasource.admin-username=${DB_ADMIN_USER:postgres}
app.datasource.admin-password=${DB_ADMIN_PASSWORD:postgres}

# Guest credentials for unauthenticated requests and new client registration
app.datasource.guest-username=${DB_GUEST_USER:guest_user}
app.datasource.guest-password=${DB_GUEST_PASSWORD:guest_pass_2026}

# HikariCP pool settings per user
app.datasource.hikari.maximum-pool-size=5
app.datasource.hikari.minimum-idle=1
app.datasource.hikari.idle-timeout=60000
app.datasource.hikari.max-lifetime=300000
app.datasource.hikari.connection-timeout=5000

# JSON Formatting
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Europe/Kyiv
spring.jackson.serialization.write-dates-as-timestamps=false

# Logging
logging.level.com.fitness=DEBUG
logging.level.org.springframework.jdbc.core=DEBUG

# Static Resource Caching (disabled for development)
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false
